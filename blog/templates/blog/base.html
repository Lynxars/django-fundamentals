{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}My Blog{% endblock %}</title>
  <style>
    /* minimal reset + layout */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; color: #222; }
    nav { background: #085041; padding: 1rem 2rem;
          display: flex; justify-content: space-between; align-items: center; }
    nav a { color: #9FE1CB; text-decoration: none; margin-left: 1rem; }
    nav .brand { color: #fff; font-weight: bold; font-size: 1.1rem;
                 display: flex; align-items: center; gap: 8px; text-decoration: none; }
    main { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    footer { text-align: center; padding: 2rem; color: #888; font-size: 0.85rem;
            border-top: 1px solid #eee; margin-top: 3rem; }
  </style>

  <!-- Bootstrap CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- 2. Link your custom local stylesheet -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

  <nav>
    <a href="{% url 'blog:home' %}" class="brand">
      <img src="{% static 'images/logo (2).png' %}" alt="My Blog logo" height="32">
      My Blog
    </a>
    <div>
      <a href="{% url 'blog:home' %}">Home</a>
      <a href="{% url 'blog:about' %}">About</a>
    </div>
  </nav>
  
  <main>
    <div class="container my-4">
      {% block content %}
      {% endblock %}
    </div>
  </main>
  
  <footer>
    <p>My Blog — Built with Django</p>
  </footer>

</body>
</html>
