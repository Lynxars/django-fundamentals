{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}My Blog{% endblock %}</title>
  <style>
    /* minimal reset + layout */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; color: #222; }

    main { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    footer { text-align: center; padding: 2rem; color: #888; font-size: 0.85rem;
            border-top: 1px solid #eee; margin-top: 3rem; }
  </style>

<!-- Bootstrap CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Your custom local stylesheet -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="{% url 'blog:home' %}">
        <img src="{% static 'images/logo (2).png' %}" alt="Site Logo" height="40" class="me-2">
        <span>DevBlog</span>
      </a>
      <div class="ms-auto d-flex align-items-center">
        <!-- Check if user is logged in -->
        {% if user.is_authenticated %}
          <span class="text-light me-3">Welcome, <strong>{{ user.username }}</strong></span>
          <a href="{% url 'blog:create_post' %}" class="btn btn-primary btn-sm me-2">Write a Post</a>
          <!-- Django logout requires a POST request for security -->
          <form action="{% url 'logout' %}" method="POST" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
          </form>
        {% else %}
          <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">Login</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main>
    <div class="container my-4">
      {% block content %}
      {% endblock %}
    </div>
  </main>

  <footer>
    <p>My Blog — Built with Django</p>
  </footer>

</body>
</html>
