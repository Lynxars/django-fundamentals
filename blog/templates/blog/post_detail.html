{% extends 'blog/base.html' %}

{% block content %}
  <h1>{{ post.title }}</h1>
  <p class="text-muted">By {{ post.author }} in {{ post.category }} on {{ post.created_at|date:"F d, Y" }}</p>

  <div class="mb-3">
    <a href="{% url 'blog:update_post' slug=post.slug %}" class="btn btn-warning btn-sm">Edit Post</a>
    <!-- Add the delete button next to the edit button -->
    <a href="{% url 'blog:delete_post' slug=post.slug %}" class="btn btn-danger btn-sm">Delete Post</a>
  </div>

  <hr>
  <p>{{ post.body }}</p>
  <a href="{% url 'blog:home' %}" class="btn btn-secondary btn-sm">Back to Home</a>
{% endblock %}
